name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  humble:
    name: ROS 2 Humble build and test
    runs-on: ubuntu-22.04
    container: ros:humble-ros-base-jammy
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      ROS_DISTRO: humble
      ROS_LOCALHOST_ONLY: "1"
      CMAKE_BUILD_PARALLEL_LEVEL: "2"
      MAKEFLAGS: -j2
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          path: src/vq_map_server
          persist-credentials: false
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            python3-colcon-common-extensions python3-rosdep
          if [ ! -f /etc/ros/rosdep/sources.list.d/20-default.list ]; then
            rosdep init
          fi
          rosdep update --rosdistro "$ROS_DISTRO"
          rosdep install --from-paths src --ignore-src --rosdistro "$ROS_DISTRO" -y
      - name: Build
        run: |
          source /opt/ros/"$ROS_DISTRO"/setup.bash
          colcon build --packages-select vq_map_server --executor sequential \
            --event-handlers console_direct+ \
            --cmake-args -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Test
        run: |
          source install/setup.bash
          colcon test --packages-select vq_map_server \
            --event-handlers console_direct+ --return-code-on-test-failure
      - name: Report test results
        if: ${{ always() }}
        run: colcon test-result --verbose
      - name: Check installed launch and CLI entry points
        run: |
          source install/setup.bash
          for dimension in 2d 3d; do
            ros2 launch vq_map_server "vq_map_server_${dimension}.launch.xml" --show-args
            ros2 run vq_map_server "vq_map_convert_${dimension}" --help
            ros2 run vq_map_server "vq_map_inspect_${dimension}" --help
          done
